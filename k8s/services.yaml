apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: booking-platform
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: booking-platform
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: booking-platform
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: booking-platform
spec:
  selector:
    app: booking-service
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP   
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service-nodeport
  namespace: booking-platform
spec:
  selector:
    app: booking-service
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080  
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: booking-platform
spec:
  selector:
    app: notification-service
  ports:
  - port: 80  
    targetPort: 80   
  type: ClusterIP